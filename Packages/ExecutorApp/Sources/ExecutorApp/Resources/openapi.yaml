openapi: 3.1.0
info:
  title: tart-executor management API
  description: >-
    Management & debugging API for a tart-executor instance. Exposes job introspection and
    control, Tart virtual-machine and image management, effective settings, and health.

    When an `apiToken` is configured in `~/tart-executor.yaml`, every `/api/v1/*` endpoint
    except `/health`, `/openapi.yaml`, and `/docs` requires an
    `Authorization: Bearer <token>` header.
  version: 0.25.0
servers:
  - url: /api/v1
    description: Served on the executor's webhook port (see `webhook.port`, e.g. 3250).
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Jobs
  - name: Virtual Machines
  - name: Settings
  - name: GitHub
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness and version
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /status:
    get:
      tags: [Health]
      summary: Current job and capacity status
      responses:
        "200":
          description: Status snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorStatusResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /settings:
    get:
      tags: [Settings]
      summary: Effective settings (secrets redacted)
      responses:
        "200":
          description: The executor's effective configuration. Secrets are never included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorSettingsResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /jobs:
    get:
      tags: [Jobs]
      summary: List tracked jobs
      parameters:
        - name: state
          in: query
          required: false
          description: Optional lifecycle filter.
          schema:
            $ref: "#/components/schemas/ExecutorJobState"
      responses:
        "200":
          description: The jobs currently tracked by the executor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorJobsResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /jobs/{id}:
    get:
      tags: [Jobs]
      summary: Get a single job
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorJobDTO"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /jobs/{id}/cancel:
    post:
      tags: [Jobs]
      summary: Cancel a single job by id
      description: Cancels any running VM task for the job and drops it from the queues.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job was cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No job with that id was tracked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"
  /jobs/cancel:
    post:
      tags: [Jobs]
      summary: Cancel jobs by label set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelJobsRequest"
      responses:
        "200":
          description: Number of jobs cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /jobs/cancel-all:
    post:
      tags: [Jobs]
      summary: Cancel every active job
      responses:
        "200":
          description: All active jobs were cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /jobs/dispatch:
    post:
      tags: [Jobs]
      summary: Start a virtual machine for a job
      description: >-
        Starts a virtual machine for a GitHub Actions job the executor never received a webhook
        for, or received and lost. Applies exactly the same label rules as the webhook path, so a
        dispatched job cannot reach a machine the webhook path would have refused.


        Never returns an ambiguous success: either a machine was started (`200`, `started: true`)
        or the response says why not (`409`/`422` with a `reason`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutorDispatchRequest"
      responses:
        "200":
          description: A virtual machine was started for the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorDispatchResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: >-
            Nothing was started. `virtual_machine_exists` means a machine for this job id is
            already running here and `force` will not override it — cancel the job first.
            `already_tracked` and `at_capacity` are both overridden by `force`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorDispatchResponse"
        "422":
          description: The labels do not describe a job this executor can run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorDispatchResponse"
  /github/job-observations:
    post:
      tags: [GitHub]
      summary: Observe confirmed runner jobs without scheduling or cancelling work
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobs]
              properties:
                jobs:
                  type: array
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/GitHubJobContext" }
      responses:
        "200": { description: Observations accepted; only exact registered runner matches are applied. }
        "400": { description: Invalid observations. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /github/queued-jobs:
    get:
      tags: [GitHub]
      summary: List GitHub Actions jobs waiting for a runner
      description: >-
        Uses the executor's GitHub App credentials to find every Actions job GitHub currently
        reports as `queued`, annotated with what this executor would do with it. Callers need no
        GitHub credentials of their own.


        Results are cached and served stale-while-revalidate, so polling is cheap. A scan that
        hits a repository cap, its time budget, or the rate-limit floor still returns `200` with
        `truncated: true` and an explanation in `warnings` — a degraded scan must never look like
        an empty queue.


        Requires the GitHub App to hold the `Actions: read` permission. Without it every scan is
        denied and the reason appears in `warnings`. Discovery is bounded by configured
        repository and recent-run limits; jobs outside those windows may be omitted. Absence
        from this response is never proof that a job completed.
      parameters:
        - name: matching
          in: query
          required: false
          description: >-
            `true` (default) returns only jobs this executor's runner labels accept. `all`
            returns every queued job, each carrying `matchesRunnerLabels`. Callers aggregating a
            heterogeneous fleet should use `all`, or jobs only another executor can run are
            silently missing.
          schema:
            type: string
            enum: [ "true", all ]
        - name: refresh
          in: query
          required: false
          description: >-
            Set to `true` to request a fresh scan. A failed refresh can still return an older
            snapshot; check `scannedAt` before using results for automatic provisioning.
          schema: { type: string, enum: [ "true" ] }
      responses:
        "200":
          description: The queued jobs, possibly from a partial scan (see `truncated`/`warnings`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubQueuedJobsResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502":
          description: The scan failed and no earlier snapshot was available.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: GitHub scanning is disabled or unconfigured (`github.scan.enabled`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /github/jobs/{id}:
    get:
      tags: [GitHub]
      summary: Get a fresh GitHub job status
      description: >-
        Looks up this exact job using the executor's GitHub App credentials and its
        `Actions: read` permission. Includes completed jobs outside the queued-job scanner's
        recent-run window. Returns lookup failures as errors, never as completed jobs.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: repository
          in: query
          required: true
          description: Repository containing the job, in owner/repo form.
          schema: { type: string, example: bludesign/tart }
      responses:
        "200":
          description: Fresh state reported by GitHub for this job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubJobStatusDTO" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502":
          description: >-
            GitHub lookup failed, including missing jobs, denied access, unavailable responses,
            or mismatched job data. No job state should be inferred from this error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: GitHub scanning is disabled or unconfigured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /vms:
    get:
      tags: [Virtual Machines]
      summary: List local Tart virtual machines and images
      responses:
        "200":
          description: Local VMs / images from `tart list`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualMachineListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /vms/{name}:
    get:
      tags: [Virtual Machines]
      summary: Get a virtual machine (with IP)
      parameters:
        - $ref: "#/components/parameters/VmName"
      responses:
        "200":
          description: The virtual machine, including its IP address if resolvable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualMachineDTO"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Virtual Machines]
      summary: Delete a virtual machine
      parameters:
        - $ref: "#/components/parameters/VmName"
      responses:
        "204":
          description: The virtual machine was deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /images/pull:
    post:
      tags: [Virtual Machines]
      summary: Pull an image into the local Tart store
      description: Runs `tart pull`. May take a while for large images; the call blocks until done.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImagePullRequest"
      responses:
        "200":
          description: The image was pulled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  name: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    JobId:
      name: id
      in: path
      required: true
      description: GitHub workflow job id.
      schema: { type: integer }
    VmName:
      name: name
      in: path
      required: true
      description: Virtual machine name.
      schema: { type: string }
  responses:
    Unauthorized:
      description: A bearer token is configured and was missing or invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: The resource was not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServerError:
      description: The operation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    HealthResponse:
      type: object
      required: [status, service, version, startedAt, uptimeSeconds]
      properties:
        status: { type: string }
        service: { type: string }
        version: { type: string }
        startedAt: { type: string, format: date-time }
        uptimeSeconds: { type: number }
    WorkflowAction:
      type: string
      enum: [router_start, waiting, queued, in_progress, completed, unknown]
    ExecutorJobState:
      type: string
      enum: [pending, in_progress, active]
      description: >-
        `pending` = queued; `in_progress` = reported running by GitHub; `active` = a VM still
        exists for the job though it is no longer tracked as pending/in-progress.
    ExecutorStatusResponse:
      type: object
      required:
        [hostname, inProgressJobs, pendingJobs, startedPendingJobs, activeVirtualMachines,
         virtualMachineLimit, cpuLimit, cpuUsed, totalMemory, memoryUsed]
      properties:
        hostname: { type: string }
        inProgressJobs: { type: integer }
        pendingJobs: { type: integer }
        startedPendingJobs: { type: integer }
        activeVirtualMachines: { type: integer }
        virtualMachineLimit: { type: integer }
        cpuLimit:
          type: integer
          description: Aggregate CPU capacity available to virtual machines.
        cpuUsed: { type: integer }
        totalMemory:
          type: integer
          description: Aggregate memory capacity available to virtual machines, in binary MB.
        memoryUsed: { type: integer }
        defaultCpu:
          type: [integer, "null"]
          description: Per-VM CPU used when a job omits the cpu label.
        defaultMemory:
          type: [integer, "null"]
          description: Per-VM memory used when a job omits the memory label, in binary MB.
        diskTotalBytes:
          type: [integer, "null"]
          description: Total capacity of the volume backing the Tart home directory, in bytes.
        diskFreeBytes:
          type: [integer, "null"]
          description: Available capacity of the Tart home volume, in bytes.
        diskUsedBytes:
          type: [integer, "null"]
          description: Used capacity of the Tart home volume, in bytes.
    ExecutorSettingsResponse:
      type: object
      required: [hostname, numberOfMachines, runnerLabels, webhookPort, isHeadless, isInsecure,
                 insecureDomains, cpuLimit, totalMemory, authEnabled]
      properties:
        hostname: { type: string }
        numberOfMachines: { type: integer }
        runnerLabels: { type: string }
        webhookPort: { type: integer }
        routerUrl: { type: [string, "null"] }
        localUrl: { type: [string, "null"] }
        isHeadless: { type: boolean }
        isInsecure: { type: boolean }
        insecureDomains:
          type: array
          items: { type: string }
        netBridgedAdapter: { type: [string, "null"] }
        defaultCpu: { type: [integer, "null"] }
        defaultMemory: { type: [integer, "null"] }
        cpuLimit:
          type: integer
          description: Aggregate CPU capacity available to virtual machines.
        totalMemory:
          type: integer
          description: Aggregate memory capacity available to virtual machines, in binary MB.
        loggingEndpoint: { type: [string, "null"] }
        authEnabled:
          type: boolean
          description: Whether a bearer token is configured for this API.
    ExecutorJobDTO:
      type: object
      required: [id, action, state, labels, didStart]
      properties:
        github:
          $ref: "#/components/schemas/GitHubJobContext"
        id: { type: integer }
        action: { $ref: "#/components/schemas/WorkflowAction" }
        state: { $ref: "#/components/schemas/ExecutorJobState" }
        labels:
          type: array
          items: { type: string }
        didStart: { type: boolean }
        cpu: { type: [integer, "null"] }
        memory: { type: [integer, "null"] }
        imageName: { type: [string, "null"] }
        vmName: { type: [string, "null"] }
        vmUUID: { type: [string, "null"] }
        queuedAt: { type: [string, "null"], format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
    ExecutorJobsResponse:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items: { $ref: "#/components/schemas/ExecutorJobDTO" }
    VirtualMachineDTO:
      type: object
      required: [name, managedByExecutor]
      properties:
        createdForJob:
          $ref: "#/components/schemas/GitHubJobContext"
        assignedJob:
          $ref: "#/components/schemas/GitHubJobContext"
        cpu: { type: [integer, "null"] }
        memory: { type: [integer, "null"], description: Configured memory in MiB; detail endpoint only. }
        os: { type: [string, "null"] }
        name: { type: string }
        ipAddress: { type: [string, "null"] }
        jobId: { type: [integer, "null"] }
        managedByExecutor: { type: boolean }
        state:
          type: [string, "null"]
          description: Lifecycle state reported by Tart, e.g. running, stopped, suspended.
        running: { type: [boolean, "null"] }
        sizeGB:
          type: [number, "null"]
          description: Actual on-disk usage in gigabytes.
        diskGB:
          type: [number, "null"]
          description: Provisioned disk size in gigabytes.
        source:
          type: [string, "null"]
          description: Origin as reported by Tart, e.g. local.
    VirtualMachineListResponse:
      type: object
      required: [virtualMachines]
      properties:
        virtualMachines:
          type: array
          items: { $ref: "#/components/schemas/VirtualMachineDTO" }
    ImagePullRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        isInsecure: { type: [boolean, "null"] }
    CancelJobsRequest:
      type: object
      required: [labels]
      properties:
        labels:
          type: array
          items: { type: string }
          uniqueItems: true
    CancelResponse:
      type: object
      required: [cancelled]
      properties:
        cancelled: { type: boolean }
        cancelledCount: { type: [integer, "null"] }
    DispatchSkipReason:
      type: string
      enum: [virtual_machine_exists, already_tracked, at_capacity, label_mismatch, no_host_available]
      description: >-
        Why nothing was started. `virtual_machine_exists` is never overridden by `force`;
        `already_tracked` and `at_capacity` are. `no_host_available` is router-only.
    ExecutorDispatchRequest:
      type: object
      required: [id, labels]
      properties:
        repository: { type: [string, "null"] }
        github:
          $ref: "#/components/schemas/GitHubJobContext"
        id:
          type: integer
          description: GitHub workflow job id.
        labels:
          type: array
          minItems: 1
          items: { type: string }
          description: >-
            The job's complete GitHub label set, with values unchanged. These become the runner's
            `--labels`; removing or changing required labels can leave the machine idle while
            GitHub continues waiting. Copy the array straight from the job.
        force:
          type: [boolean, "null"]
          description: >-
            Bypasses the already-tracked and capacity guards. Deliberately over-commits the host
            past `tart.numberOfVirtualMachines`, ignoring `cpuLimit` and `totalMemory`. Never
            bypasses the existing-machine guard.
    ExecutorDispatchResponse:
      type: object
      required: [started, jobId, hostname, forced]
      properties:
        started: { type: boolean }
        jobId: { type: integer }
        hostname: { type: string }
        vmName:
          type: [string, "null"]
          description: The machine that was started, or the existing one on a conflict.
        imageName: { type: [string, "null"] }
        cpu: { type: [integer, "null"] }
        memory: { type: [integer, "null"] }
        forced: { type: boolean }
        reason:
          oneOf:
            - $ref: "#/components/schemas/DispatchSkipReason"
            - type: "null"
        message: { type: [string, "null"] }
    GitHubJobStatusDTO:
      type: object
      required: [id, repository, status, labels]
      properties:
        github:
          $ref: "#/components/schemas/GitHubJobContext"
        id: { type: integer }
        repository:
          type: string
          description: Repository containing the job, in owner/repo form.
        status:
          type: string
          description: GitHub job status, such as queued, in_progress, or completed.
        labels:
          type: array
          items: { type: string }
        runnerName:
          type: [string, "null"]
          description: Runner assigned by GitHub, when available.
    GitHubQueuedJobDTO:
      type: object
      required: [id, runId, name, repository, labels, createdAt, matchesRunnerLabels]
      properties:
        github:
          $ref: "#/components/schemas/GitHubJobContext"
        id:
          type: integer
          description: GitHub workflow job id. Pass this to `/jobs/dispatch`.
        runId: { type: integer }
        name: { type: string }
        workflowName: { type: [string, "null"] }
        repository:
          type: string
          description: "`owner/repo`."
        htmlUrl: { type: [string, "null"] }
        labels:
          type: array
          items: { type: string }
          description: >-
            GitHub's label set, sorted for stable output but otherwise untouched. Pass this
            straight to `/jobs/dispatch`.
        createdAt: { type: string, format: date-time }
        matchesRunnerLabels:
          type: boolean
          description: Whether this executor's runner labels and image rule accept the job.
        labelMismatchReason:
          type: [string, "null"]
          description: >-
            Why the job was rejected. A long-queued job with a reason here is usually a workflow
            with the wrong `runs-on`, not a lost webhook.
        imageName: { type: [string, "null"] }
        cpu: { type: [integer, "null"] }
        memory: { type: [integer, "null"] }
    GitHubQueuedJobsResponse:
      type: object
      required: [hostname, jobs, scannedAt, repositoriesScanned, truncated, warnings]
      properties:
        runnerJobs:
          type: [array, "null"]
          description: Positive runner observations from unfinished runs; never scheduling demand.
          items: { $ref: "#/components/schemas/GitHubJobContext" }
        hostname: { type: string }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/GitHubQueuedJobDTO" }
        scannedAt: { type: string, format: date-time }
        repositoriesScanned: { type: integer }
        truncated:
          type: boolean
          description: The scan stopped before covering every repository.
        warnings:
          type: array
          items: { type: string }
          description: >-
            Why the scan was degraded, e.g. a missing `Actions: read` permission or a spent rate
            limit. Show these; an empty `jobs` array alone does not mean the queue is empty.
        rateLimitRemaining: { type: [integer, "null"] }
        rateLimitResetAt: { type: [string, "null"], format: date-time }

    GitHubJobContext:
      type: object
      description: Display metadata and positive runner observations, independent of scheduling.
      required: [workflowJobId]
      properties:
        workflowJobId: { type: string, description: Canonical decimal GitHub job identifier. }
        workflowRunId: { type: [string, "null"] }
        repository: { type: [string, "null"] }
        name: { type: [string, "null"] }
        workflowName: { type: [string, "null"] }
        htmlUrl: { type: [string, "null"] }
        runUrl: { type: [string, "null"] }
        runTitle: { type: [string, "null"] }
        event: { type: [string, "null"] }
        actor: { type: [string, "null"] }
        headBranch: { type: [string, "null"] }
        headSha: { type: [string, "null"] }
        status: { type: [string, "null"] }
        conclusion: { type: [string, "null"] }
        runnerName: { type: [string, "null"] }
        source: { type: [string, "null"] }
        runNumber: { type: [integer, "null"] }
        runAttempt: { type: [integer, "null"] }
        createdAt: { type: [string, "null"], format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        observedAt: { type: [string, "null"], format: date-time }
        warnings:
          type: [array, "null"]
          items: { type: string }
